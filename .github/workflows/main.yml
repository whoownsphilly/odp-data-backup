name: Main
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

concurrency:
  group: odp-data-backup
  cancel-in-progress: false

env:
  DOWNLOADER_SOURCE: git+https://github.com/whoownsphilly/open-data-philly-downloader@69dccd06d0c0dd1b49229291d86120726ecaee45

jobs:
  upload-odp-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set current date as env variable
        run: echo "NOW=$(date +'%Y-%m-%dT%H_%M_%S')" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Download opa_properties_public
        run: uvx --from "$DOWNLOADER_SOURCE" odp-download by-col --table opa_properties_public --csv-split-col zip_code --db-filepath open_data_philly.next.db --index zip_code
      - name: Download rental business_licenses
        run: uvx --from "$DOWNLOADER_SOURCE" odp-download by-datetime --table business_licenses --split-by initialissuedate year --where "licensetype = 'Rental'" --db-filepath open_data_philly.next.db --index initialissuedate
      - name: Download violations since 2020
        run: uvx --from "$DOWNLOADER_SOURCE" odp-download by-datetime --table violations --split-by violationdate year --where "violationdate >= '2020-01-01'" --db-filepath open_data_philly.next.db --index violationdate
      - name: Download rtt_summary
        run: uvx --from "$DOWNLOADER_SOURCE" odp-download by-datetime --table rtt_summary --split-by recording_date year --where "document_type IN ('DEED', 'DEED_SHERIFF', 'DEED OF CONDEMNATION', 'DEED LAND BANK')" --db-filepath open_data_philly.next.db --index recording_date
      - name: Verify database
        run: |
          test "$(sqlite3 open_data_philly.next.db 'PRAGMA integrity_check;')" = "ok"
          mv open_data_philly.next.db open_data_philly.db
      - name: Create Release Tag
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git tag -a "v${{ env.NOW }}" -m "Release for ${{ env.NOW }}"
          git push origin "v${{ env.NOW }}"
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.NOW }}
          name: Open Data Philly DB - ${{ env.NOW }}
          body: |
            Database backup from Open Data Philly

            Generated on: ${{ env.NOW }}
          files: |
            open_data_philly.db
