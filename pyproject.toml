[project]
name = "wop-odp-backups"
version = "0.3.0"
description = "Generic OpenDataPhilly downloader and monthly SQLite backup."
readme = "README.md"
requires-python = ">=3.10.4"
dependencies = [
    "click>=8.1,<9",
    "requests>=2.31,<3",
]

[project.scripts]
odp-download = "odp_data_backups.cli:cli"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/odp_data_backups"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
